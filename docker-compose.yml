services:
  nginx_proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ENABLE_LETSENCRYPT=true  # Enable Let's Encrypt for SSL
      - HTTPS_METHOD=redirect    # Redirect HTTP to HTTPS
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html  # Shared volume for ACME challenges
    networks:
      - proxy_network

  acme_companion:
    image: nginxproxy/acme-companion
    container_name: acme_companion
    restart: always
    depends_on:
      - nginx_proxy
    environment:
      - NGINX_PROXY_CONTAINER=nginx_proxy  # Required for ACME companion
      - DEFAULT_EMAIL=proavinashthakur@gmail.com
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - acme:/etc/acme.sh
      - html:/usr/share/nginx/html  # Ensure ACME challenge files are shared
    networks:
      - proxy_network

  trading_server:
    build: .
    container_name: trading_server
    restart: always
    ports:
      - "5002:5002"
    command: ["python", "trading_server.py"]
    expose:
      - "5002"
    environment:
      - VIRTUAL_HOST=trading-server.gw-intech.com
      - LETSENCRYPT_HOST=trading-server.gw-intech.com
      - VIRTUAL_PORT=5002
    depends_on:
      - nginx_proxy
      - acme_companion
    networks:
      - proxy_network

  ai_trade_analysis:
    build: .
    container_name: ai_trade_analysis
    restart: always
    ports:
      - "5005:5005"
    expose:
      - "5005"
    command: ["python", "ai_trade_analysis.py"]
    environment:
      - VIRTUAL_HOST=ai-trading-analysis.gw-intech.com
      - LETSENCRYPT_HOST=ai-trading-analysis.gw-intech.com
      - VIRTUAL_PORT=5005
    depends_on:
      - nginx_proxy
      - acme_companion
    networks:
      - proxy_network

volumes:
  certs:
  vhost:
  html:
  acme:

networks:
  proxy_network:
    driver: bridge
